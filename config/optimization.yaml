# Optuna Optimization Configuration

database:
  url: "postgresql+psycopg2://optuna:optuna_pw@localhost:5432/optuna_db"
  use_sqlite_fallback: true
  sqlite_path: "optuna_study.db"

study:
  name_prefix: "params_optimal_capsule"
  n_trials: 5000
  n_jobs: 4
  timeout: 600.0
  sampler: "NSGAIIISampler"  # NSGAIIISampler, TPESampler, CmaEsSampler

episode:
  Tc: 0.002
  duration: 20.0
  delta_deg: 4.5
  scaling_threshold: 0.5

weights:
  safety_penetration: 3.0
  scaling: 1.5
  smoothness: 1.0
  trajectory_error: 1.0

multitrial:
  scenarios:
    - "h_high"
    - "h_low"
    - "h_025"
    - "h_05"
  weights: [1.0, 2.0, 1.5, 1.0]

controller:
  C_0: 0.10
  use_soft_tube: true
  lambda_tube: 1.0e5
  # Robust Covariance Parameters (99.9% Gaussian confidence)
  beta: 3.291
  sigma_p: 0.015
  sigma_v: 0.072
  sigma_a: 0.196
  # Volumetric Capsule Distance Model
  # Set use_capsules to true to optimize against continuous 3D cylindrical link capsules
  use_capsules: true
  robot_capsule_radius: 0.025
  human_capsule_radius: 0.025
  robot_links:
    - "forearm_link"
    - "wrist_1_link"
    - "wrist_2_link"
    - "tool0"

ranges:
  lambda_pos: [100.0, 100000.0]
  lambda_vel: [0.01, 100.0]
  lambda_acc: [1.0e-11, 1.0e-4]
  lambda_scaling: [5.0, 500.0]
  lambda_tube: [1.0e3, 1.0e7]
  gamma: [0.5, 15.0]
