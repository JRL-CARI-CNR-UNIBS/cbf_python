# ==============================================================================
# GPR Dataset Builder Configuration (Lexicographic Selection)
# ==============================================================================

database:
  use_sqlite: false
  sqlite_path: "optuna_gpr_grid.db"
  url: "postgresql+psycopg2://optuna:optuna_pw@192.169.1.16:5432/optuna_db"
  study_prefix: "gpr_slice"

# Grid density selection (enables comparative studies in the paper)
grid_selection:
  # Mode: 'all' (full oversampled grid), 'coarse' (subsampled), 'medium', or 'custom'
  mode: "all"
  subsample_h_step: 1       # Stride along margin h (1 = full density, 2 = half density)
  subsample_v_step: 1       # Stride along relative velocity v_rel
  min_h: -0.05              # Grid lower bound on margin h [m]
  max_h: 0.80               # Grid upper bound on margin h [m]
  min_v: -0.4               # Grid lower bound on closing velocity [m/s]
  max_v: 1.5                # Grid upper bound on closing velocity [m/s]

# ==============================================================================
# Lexicographical Multi-Objective Selection Parameters
# ==============================================================================
lexicographic:
  # Flag: 
  #   true  = Hard regime switching at h_crit (distinct Human Safety vs Industrial Productivity modes)
  #   false = Smooth continuous adaptive relaxation (continuous GPR regression surface)
  hard_switching: true
  h_crit: 0.20              # Threshold [m] separating proximity (hazard) regime from nominal (safe) regime

  # ----------------------------------------------------------------------------
  # Configuration for Hard Switching Mode (when hard_switching: true)
  # ----------------------------------------------------------------------------
  hard_regime:
    proximity:  # For h < h_crit: Safety -> Smoothness -> Performance -> Infeasibility
      safety_quantile: 0.15           # Top 15% safest trials (closest to theoretical clearance limit)
      smoothness_quantile: 0.60       # Top 60% smoothest trials among safe candidates (rejects 40% most jerky)
      max_tv_cart: 25.0               # Absolute Cartesian error TV ceiling [mm] (ISO 9283 vibration limit)
      performance_top_ratio: 0.75     # Willing to sacrifice tracking speed down to 75% of peak for safety

    nominal:    # For h >= h_crit: Performance -> Smoothness -> Safety -> Infeasibility
      performance_top_ratio: 0.95     # Demands >= 95% of peak throughput (prioritizes industrial speed)
      smoothness_quantile: 0.70       # Top 70% smoothest among high-speed solutions (minimizes motor wear)
      min_safety_quantile: 0.90       # Safety sanity check: discards bottom 10% extreme outliers / anomalies

  # ----------------------------------------------------------------------------
  # Configuration for Smooth Switching Mode (when hard_switching: false)
  # ----------------------------------------------------------------------------
  smooth_regime:
    # Tier 1: Safety Gate (relaxes smoothly as distance h increases)
    # Formula: q(h) = clip(q0 + beta * max(0, h), q_min, q_max)
    safety:
      mode: "quantile"        # 'quantile' (scale-invariant, recommended) or 'threshold'
      q0: 0.10                # Base quantile of safest trials at h = 0 (top 10% safest)
      beta: 1.5               # Expansion slope per meter (reaches ~85% acceptance at h = 0.50 m)
      q_min: 0.05             # Minimum quantile clamp
      q_max: 0.85             # Maximum quantile clamp (always discards bottom 15% least safe)
      min_safety_index: 0.10  # Minimum allowable S_index (used only if mode is set to 'threshold')

    # Tier 2: Smoothness / Jerk Gate (tolerates more dynamic motion as distance h increases)
    # Formula: TV_max(h) = base_max_tv + tv_slope * max(0, h)
    #          q_tv(h)   = clip(base_quantile + quantile_slope * max(0, h), 0.50, 0.98)
    smoothness:
      base_max_tv: 20.0       # Base Cartesian TV cut-off at h = 0 [mm]
      tv_slope: 25.0          # TV tolerance expansion slope [mm/m] (reaches 40 mm at h = 0.80 m)
      base_quantile: 0.60     # Base smoothness quantile at h = 0 (top 60% smoothest)
      quantile_slope: 0.40    # Quantile expansion slope (relaxes to ~92% at h = 0.80 m)

    # Tier 3: Performance Pool (tightens toward peak throughput as distance h increases)
    # Formula: ratio(h) = min(0.98, base_top_ratio + slope * max(0, h))
    performance:
      base_top_ratio: 0.80    # Base throughput requirement at h = 0 (accepts 80% speed)
      slope: 0.20             # Throughput demand slope per meter (demands >= 96% speed at h = 0.80 m)

  # ----------------------------------------------------------------------------
  # Common Tie-Breaker Configuration (Lowest QP Infeasibility Count)
  # ----------------------------------------------------------------------------
  infeasibility:
    primary_key: "user_attrs_unfeasible_count"
    secondary_key: "values_performance"

# ==============================================================================
# Output Configuration
# ==============================================================================
output:
  output_csv: "gpr_training_dataset.csv"
  log_transform_lambdas: true   # Save both raw and log10 transformed controller weights
  save_diagnostics_plot: true
