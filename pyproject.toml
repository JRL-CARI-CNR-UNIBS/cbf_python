[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbf_python"
version = "0.1.0"
description = "Modular Control Barrier Function (CBF) and Safe Trajectory Scaling for Manipulators in ROS 2"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Samuele Sandrini", email = "samuele.sandrini@polito.it" },
    { name = "JRL-CARI-CNR-UNIBS" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "numba>=0.58.0",
    "quadprog>=0.1.11",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "optuna>=3.0.0",
    "meshcat>=0.3.2",
]

[tool.setuptools]
packages = [
    "cbf_python",
    "cbf_python.bridges",
    "cbf_python.controllers",
    "cbf_python.controllers.kernels",
    "cbf_python.trajectory",
    "cbf_python.utils",
    "cbf_python.examples",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
